<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#030706" />
    <meta
      name="description"
      content="Ted Koller is a director of photography working across narrative, documentary, commercial, and music projects."
    />
    <meta property="og:title" content="Ted Koller — Director of Photography" />
    <meta property="og:description" content="Selected cinematography by Ted Koller." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ted-koller-cinematography.sure-plum-0886.chatgpt.site/" />
    <meta property="og:image" content="https://ted-koller-cinematography.sure-plum-0886.chatgpt.site/images/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ted Koller — Director of Photography" />
    <meta name="twitter:description" content="Selected cinematography by Ted Koller." />
    <meta name="twitter:image" content="https://ted-koller-cinematography.sure-plum-0886.chatgpt.site/images/og.png" />
    <title>Ted Koller — Director of Photography</title>
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
    <link
      rel="preload"
      href="fonts/Futura-Book.woff"
      as="font"
      type="font/woff"
      crossorigin
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#work">Skip to work</a>

    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="#work" aria-label="Ted Koller, home">Ted Koller</a>
        <p class="role">Director of Photography</p>
        <button class="text-button" id="about-open" type="button">About</button>
      </div>
    </header>

    <main id="work">
      <h1 class="visually-hidden">Selected cinematography by Ted Koller</h1>
      <section class="gallery" id="gallery" aria-label="Selected work"></section>
    </main>

    <footer class="site-footer">
      <span>© <span id="year"></span> Ted Koller</span>
      <a href="mailto:ted@tedkoller.com">ted@tedkoller.com</a>
    </footer>

    <div class="about" id="about" aria-hidden="true">
      <button
        class="about__backdrop"
        id="about-backdrop"
        type="button"
        tabindex="-1"
        aria-label="Close About"
      ></button>
      <section
        class="about__content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="about-title"
      >
        <button class="close-button" id="about-close" type="button" aria-label="Close About"></button>
        <p class="eyebrow">About</p>
        <h2 id="about-title">Ted Koller</h2>
        <p class="about__role">Director of Photography</p>
        <p class="about__copy">
          Cinematography across narrative, documentary, commercial, and music projects.
        </p>
        <a class="about__contact" href="mailto:ted@tedkoller.com">Get in touch</a>
      </section>
    </div>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <button
        class="lightbox__backdrop"
        id="lightbox-backdrop"
        type="button"
        tabindex="-1"
        aria-label="Close project"
      ></button>
      <section
        class="lightbox__dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="lightbox-title"
      >
        <button class="close-button" id="lightbox-close" type="button" aria-label="Close project"></button>
        <div class="lightbox__stage" id="lightbox-stage"></div>
        <aside class="lightbox__details">
          <p class="eyebrow">Selected work</p>
          <h2 id="lightbox-title"></h2>
          <p id="lightbox-description"></p>
          <div class="lightbox__links" id="lightbox-links"></div>
          <div class="lightbox__thumbnails" id="lightbox-thumbnails"></div>
        </aside>
      </section>
    </div>

    <script src="js/portfolio-data.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
